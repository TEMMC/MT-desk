name: Build MT-desk APK

on:
  workflow_dispatch:
  push:
    branches: [main, fix/anr-main-thread-filesystem]
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: mt-desk-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout MT-desk
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore the existing MT-OS signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.METMC_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::Missing repository secret METMC_SIGNING_KEYSTORE_BASE64. Add the same signing-key secret used by MT-OS to MT-desk."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/mt-os-release.keystore"
          test -s "$HOME/.android/mt-os-release.keystore"
          chmod 600 "$HOME/.android/mt-os-release.keystore"

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release APK with shared signing certificate
        working-directory: app
        env:
          DROIDDESK_KEYSTORE: ${{ runner.temp }}/mt-os-release.keystore
          DROIDDESK_KEYSTORE_PASSWORD: ${{ secrets.METMC_SIGNING_STORE_PASSWORD }}
          DROIDDESK_KEY_ALIAS: ${{ secrets.METMC_SIGNING_KEY_ALIAS }}
          DROIDDESK_KEY_PASSWORD: ${{ secrets.METMC_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$DROIDDESK_KEYSTORE_PASSWORD" || -z "$DROIDDESK_KEY_ALIAS" || -z "$DROIDDESK_KEY_PASSWORD" ]]; then
            echo "::error::Missing one or more MT-OS signing secrets: METMC_SIGNING_STORE_PASSWORD, METMC_SIGNING_KEY_ALIAS, METMC_SIGNING_KEY_PASSWORD."
            exit 1
          fi
          cp "$HOME/.android/mt-os-release.keystore" "$DROIDDESK_KEYSTORE"
          flutter build apk --release

      - name: Verify APK package and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.orailnoor.droiddesk'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload signed MT-desk APK
        uses: actions/upload-artifact@v4
        with:
          name: MT-desk-signed-release-APK
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
